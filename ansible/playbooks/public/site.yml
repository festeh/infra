---
- name: Require the public inventory for the public service stack
  hosts: shared_servers
  gather_facts: false
  tasks:
    - name: Reject non-public hosts
      ansible.builtin.assert:
        that:
          - server_scope == "public"
        fail_msg: >-
          The public site playbook can run only with the public inventory.
  tags:
    - always

- name: Keep administrative access hardened
  ansible.builtin.import_playbook: ../shared/harden-ssh.yml
  tags:
    - access

- name: Converge the base server
  hosts: web_server
  become: true
  gather_facts: true
  serial: 1

  roles:
    - role: base
      tags:
        - base
    - role: caddy
      tags:
        - caddy
    - role: postgresql
      tags:
        - postgresql
    - role: cliproxyapi
      tags:
        - cliproxyapi
    - role: miniflux
      tags:
        - miniflux
    - role: dimalip
      tags:
        - dimalip
    - role: papujki
      tags:
        - papujki
    - role: coach
      tags:
        - coach
    - role: my_agents
      tags:
        - my_agents
    - role: sb_server
      tags:
        - sb_server
    - role: runtime_secrets
      tags:
        - secrets

  post_tasks:
    - name: Enforce the public-listener allowlist
      ansible.builtin.include_role:
        name: listener_audit
        apply:
          tags:
            - always
      tags:
        - always
