---
base_timezone: Europe/Berlin

tailscale_hostname: private

# The private host exposes administrative SSH and Tailscale's encrypted peer
# transport. The image's DHCP client also owns its expected non-loopback UDP
# listener.
allowed_public_listeners:
  - protocol: tcp
    port: 22
    process: sshd
  - protocol: udp
    port: 41641
    process: tailscaled
  # Tailscale's HTTP PeerAPI chooses dynamic TCP ports, but binds them only to
  # this node's private tailnet addresses. Never permit those ports on a public
  # or wildcard address.
  - protocol: tcp
    address_cidr: 100.64.0.0/10
    process: tailscaled
  - protocol: tcp
    address_cidr: fd7a:115c:a1e0::/48
    process: tailscaled
  # Paseo binds only to this node's Tailscale IPv4 address. Its own password
  # protects the agent control plane inside the encrypted tailnet.
  - protocol: tcp
    port: 6767
    address_cidr: 100.64.0.0/10
    process: Paseo Daemon
  - protocol: udp
    port: 68
    process: systemd-network
  # T3 Code binds directly to its tailnet address and requires device pairing.
  # 0.0.42 renamed the listening thread from MainThread to node-MainThread.
  - protocol: tcp
    port: 3773
    address_cidr: 100.64.0.0/10
    process: node-MainThread
  # Orca's wildcard listener stays inside a private network namespace. pasta
  # exposes only this tailnet-bound port; all automatic forwarding is disabled.
  - protocol: tcp
    port: 6768
    address_cidr: 100.64.0.0/10
    process: pasta.avx2
