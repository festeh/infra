---
sb_capture_user: sb-capture
sb_capture_group: sb-capture
sb_capture_state_directory: /var/lib/sb-capture
sb_capture_spool_directory: "{{ sb_capture_state_directory }}/spool"
sb_capture_config_directory: /etc/sb-capture
sb_capture_config_path: "{{ sb_capture_config_directory }}/config.toml"
sb_capture_rclone_config_path: "{{ sb_capture_config_directory }}/rclone.conf"
# rclone rewrites its config whenever it refreshes an access token, and does so
# by creating a temporary file alongside it — which the protected, read-only
# credential directory forbids. The service therefore works from a copy it owns
# and reseeds from the canonical one, so refreshed tokens persist instead of
# failing noisily on every upload.
sb_capture_rclone_working_config: "{{ sb_capture_state_directory }}/rclone.conf"

# Audio is trimmed and transcribed here and deleted immediately afterwards.
# systemd's RuntimeDirectory is tmpfs, so a recording never reaches a disk on
# the happy path.
sb_capture_work_directory: /run/sb-capture

sb_capture_host: 127.0.0.1
sb_capture_port: 8092
sb_capture_domain: capture.dimalip.in

sb_capture_install_root: /opt/sb-capture
sb_capture_binary_path: "{{ sb_capture_install_root }}/bin/sb-capture-server"
# Statically linked release binary built on the controller:
#   cargo build --release --target x86_64-unknown-linux-musl -p sb-capture-server
sb_capture_release_artifact_path: ""

# Google Drive destination for the original, untrimmed recordings.
sb_capture_rclone_remote: "gdrive:sb-capture"

# How often a Drive upload that failed is retried.
sb_capture_drain_interval: 15min

sb_capture_packages:
  - ffmpeg
  - rclone
