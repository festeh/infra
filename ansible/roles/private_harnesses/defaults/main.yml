---
private_harnesses_user: dima
private_harnesses_group: dima
private_harnesses_home: /home/dima

private_harnesses_mise_version: 2026.9.1
private_harnesses_mise_binary: /usr/local/bin/mise
private_harnesses_mise_config_directory: >-
  {{ private_harnesses_home }}/.config/mise
private_harnesses_mise_config: >-
  {{ private_harnesses_mise_config_directory }}/config.toml
private_harnesses_mise_lock: >-
  {{ private_harnesses_mise_config_directory }}/mise.lock
private_harnesses_mise_data_directory: >-
  {{ private_harnesses_home }}/.local/share/mise
private_harnesses_mise_cache_directory: >-
  {{ private_harnesses_home }}/.cache/mise
private_harnesses_mise_environment:
  HOME: "{{ private_harnesses_home }}"
  MISE_GLOBAL_CONFIG_FILE: "{{ private_harnesses_mise_config }}"
  MISE_CONFIG_DIR: "{{ private_harnesses_mise_config_directory }}"
  MISE_DATA_DIR: "{{ private_harnesses_mise_data_directory }}"
  MISE_CACHE_DIR: "{{ private_harnesses_mise_cache_directory }}"
  MISE_CEILING_PATHS: "{{ private_harnesses_mise_config_directory }}"
  MISE_NPM_PACKAGE_MANAGER: aube
  MISE_YES: "1"

# Version checks derive from the committed lockfile, including after a bump.
private_harnesses_upgrade: false
private_harnesses_omp_version: "{{ private_harnesses_versions['github:can1357/oh-my-pi'] }}"
private_harnesses_omp_binary: /usr/local/bin/omp

private_harnesses_kimi_version: "{{ private_harnesses_versions['npm:@moonshot-ai/kimi-code'] }}"
private_harnesses_kimi_binary: /usr/local/bin/kimi
private_harnesses_kimi_base_url: https://api.kimi.com/coding/v1
private_harnesses_kimi_default_model: k3

private_harnesses_node_version: "{{ private_harnesses_versions['node'] }}"
private_harnesses_paseo_version: "{{ private_harnesses_versions['npm:@getpaseo/cli'] }}"
private_harnesses_paseo_binary: /usr/local/bin/paseo
private_harnesses_paseo_home: "{{ private_harnesses_home }}/.paseo"
private_harnesses_paseo_port: 6767
private_harnesses_paseo_service: paseo.service
# OpenCode is here as T3 Code's provider: T3 drives agent CLIs rather than
# model APIs, and OpenCode is the one that takes an arbitrary
# OpenAI-compatible endpoint, which is what Ollama Cloud serves.
private_harnesses_opencode_version: "{{ private_harnesses_versions['npm:opencode-ai'] }}"
private_harnesses_opencode_binary: /usr/local/bin/opencode
private_harnesses_opencode_config_directory: >-
  {{ private_harnesses_home }}/.config/opencode
private_harnesses_opencode_config: >-
  {{ private_harnesses_opencode_config_directory }}/opencode.json
private_harnesses_opencode_provider: ollama-cloud
private_harnesses_opencode_base_url: https://ollama.com/v1
# Reviewed subset of what the Ollama Cloud subscription serves. The code-tuned
# Kimi drives sessions; the small one titles them and does other odd jobs.
private_harnesses_opencode_models:
  "kimi-k2.7-code": Kimi K2.7 Code
  "kimi-k3": Kimi K3
  "glm-5.3": GLM 5.3
  "minimax-m3": MiniMax M3
  "qwen3.5:397b": Qwen 3.5 397B
  "gpt-oss:120b": GPT-OSS 120B
  "gpt-oss:20b": GPT-OSS 20B
private_harnesses_opencode_model: "kimi-k2.7-code"
private_harnesses_opencode_small_model: "gpt-oss:20b"

private_harnesses_t3_version: "{{ private_harnesses_versions['npm:t3'] }}"
private_harnesses_t3_binary: /usr/local/bin/t3
private_harnesses_t3_port: 3773
private_harnesses_orca_version: "{{ private_harnesses_versions['github:stablyai/orca'] }}"
private_harnesses_orca_binary: /usr/local/bin/orca
private_harnesses_orca_port: 6768
private_harnesses_controller_paseo_password_file: >-
  {{ inventory_dir }}/group_vars/all/.paseo-password

private_harnesses_secret_directory: >-
  {{ private_harnesses_home }}/.config/private-harnesses
private_harnesses_paseo_environment_file: >-
  {{ private_harnesses_secret_directory }}/paseo.env
private_harnesses_omp_environment_file: >-
  {{ private_harnesses_secret_directory }}/omp.env
private_harnesses_opencode_environment_file: >-
  {{ private_harnesses_secret_directory }}/opencode.env
private_harnesses_legacy_environment_file: >-
  {{ private_harnesses_secret_directory }}/runtime.env
private_harnesses_kimi_home: "{{ private_harnesses_home }}/.kimi-code"
private_harnesses_kimi_config: "{{ private_harnesses_kimi_home }}/config.toml"

private_harnesses_legacy_install_roots:
  - /opt/private-harnesses
  - /opt/paseo
  - "{{ private_harnesses_mise_data_directory }}/installs/node/22.22.1"

private_harnesses_kimi_api_key: "{{ lookup('ansible.builtin.env', 'KIMI_API_KEY') }}"
private_harnesses_ollama_api_key: "{{ lookup('ansible.builtin.env', 'OLLAMA_API_KEY') }}"
private_harnesses_ollama_base_url: https://ollama.com
